<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="animeRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e4c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="100" height="100" rx="24" fill="#09090b" />
  <rect x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="url(#animeRedGrad)" stroke-width="3" opacity="0.6" />
  
  <!-- Stylized Anime 'A' Crest -->
  <path d="M50 14 L78 82 L62 82 L50 48 L38 82 L22 82 Z" fill="url(#animeRedGrad)" filter="url(#glow)" />
  <path d="M34 62 L66 62 L50 34 Z" fill="#09090b" />
